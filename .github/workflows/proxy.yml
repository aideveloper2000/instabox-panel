name: Instabox API Proxy

on:
  workflow_dispatch:
    inputs:
      apiKey:
        description: Instabox API key (ibk_...)
        required: true
        type: string
      method:
        description: HTTP method
        required: true
        type: string
        default: GET
      path:
        description: API path (e.g. /v1/machines)
        required: true
        type: string
      body:
        description: Request body (JSON string, optional)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Proxy request
        run: |
          # Build request with the user-provided API key
          curl -s -X "${{ inputs.method }}" \
            -H "X-API-Key: ${{ inputs.apiKey }}" \
            -H "Content-Type: application/json" \
            -d '${{ inputs.body }}' \
            https://api.instabox.sh${{ inputs.path }} | jq '.' > /tmp/response.json

      - name: Upload response
        uses: actions/upload-artifact@v4
        with:
          name: proxy-response
          path: /tmp/response.json
