<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instabox Panel</title>
  <meta name="description" content="Manage your Instabox machines from the browser: status, logs, metrics, commands and lifecycle actions." />
  <meta name="color-scheme" content="dark" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236a73ff'/%3E%3Cpath d='M9 10h14v3H9zm0 5.5h14v3H9zm0 5.5h9v3H9z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Icon sprite: one stroke weight, one optical size. -->
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M6.5 4.5 19 12 6.5 19.5z"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="2"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5.5v13M15 5.5v13"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2.5 4.5 14H11l-1 7.5L18.5 10H12z"/></symbol>
      <symbol id="i-fork" viewBox="0 0 24 24"><circle cx="6.5" cy="5.5" r="2.5"/><circle cx="6.5" cy="18.5" r="2.5"/><circle cx="17.5" cy="7.5" r="2.5"/><path d="M6.5 8v8M17.5 10v3.5a3.5 3.5 0 0 1-3.5 3.5H11"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2L8 4.5h8L17.5 7h2A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.5"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7M6.5 7l.9 12.2a1.5 1.5 0 0 0 1.5 1.3h6.2a1.5 1.5 0 0 0 1.5-1.3L17.5 7"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="m7 9.5 3 3-3 3M12.5 15.5H17"/></symbol>
      <symbol id="i-overview" viewBox="0 0 24 24"><path d="M8 6.5h12M8 12h12M8 17.5h12"/><circle cx="4.2" cy="6.5" r="1.1"/><circle cx="4.2" cy="12" r="1.1"/><circle cx="4.2" cy="17.5" r="1.1"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16"/><rect x="5.5" y="11" width="3" height="7" rx="1"/><rect x="10.5" y="7" width="3" height="11" rx="1"/><rect x="15.5" y="13" width="3" height="5" rx="1"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><circle cx="12" cy="8" r="0.9" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15.5" r="4"/><path d="m11 12.5 8.5-8.5M16.5 7l2.5 2.5M13.5 10l2 2"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5V15M7.5 10.5 12 15l4.5-4.5M4.5 20.5h15"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20.5V9M7.5 13.5 12 9l4.5 4.5M4.5 3.5h15"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 20.5 19.5H3.5z"/><path d="M12 10v4"/><circle cx="12" cy="16.6" r="0.9" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11.5" height="11.5" rx="2"/><path d="M5.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v.5"/></symbol>
      <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="10" y="10" width="4" height="4"/><path d="M9 2.5V6M15 2.5V6M9 18v3.5M15 18v3.5M2.5 9H6M2.5 15H6M18 9h3.5M18 15h3.5"/></symbol>
      <symbol id="i-disk" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3.5v3M12 17.5v3"/></symbol>
      <symbol id="i-net" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.8 3.2 2.8 13.8 0 17M12 3.5c-2.8 3.2-2.8 13.8 0 17"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-snapshot" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M5 7.5A2.5 2.5 0 0 1 7.5 5h1.6L11 3h2l1.9 2h1.6A2.5 2.5 0 0 1 19 7.5v9A2.5 2.5 0 0 1 16.5 19h-9A2.5 2.5 0 0 1 5 16.5z"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#i-grid" /></svg></span>
      <span class="brand-name">Instabox Panel</span>
      <span class="conn" id="conn" title="API connection">
        <span class="conn-dot" data-state="idle"></span>
        <span class="conn-text">Checking…</span>
      </span>
    </div>
    <div class="topbar-actions">
      <label class="key-picker">
        <span class="key-picker-label">API key</span>
        <select id="keySelect" aria-label="Active API key"></select>
      </label>
      <button class="btn btn-primary btn-sm" id="addKeyBtn">
        <svg class="icon"><use href="#i-plus" /></svg><span>Add key</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-tools">
        <div class="search-field">
          <svg class="icon field-icon"><use href="#i-search" /></svg>
          <input id="searchInput" type="search" placeholder="Search name or ID" autocomplete="off" aria-label="Search machines" />
        </div>
        <div class="sidebar-row">
          <select id="statusFilter" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="running">Running</option>
            <option value="stopped">Stopped</option>
            <option value="suspended">Suspended</option>
            <option value="creating">Creating</option>
            <option value="starting">Starting</option>
            <option value="resuming">Resuming</option>
            <option value="error">Error</option>
          </select>
          <button class="btn btn-ghost btn-sm btn-icon" id="refreshBtn" title="Refresh machines" aria-label="Refresh machines">
            <svg class="icon"><use href="#i-refresh" /></svg>
          </button>
        </div>
      </div>

      <div class="machine-list" id="machineList" role="listbox" aria-label="Machines"></div>
      <div class="sidebar-foot" id="listStatus"></div>
    </aside>

    <main class="detail" id="detail">
      <div class="empty" id="detailEmpty">
        <div class="empty-art">
          <svg class="icon empty-icon"><use href="#i-grid" /></svg>
        </div>
        <h2 class="empty-title">No machine selected</h2>
        <p class="empty-copy">Pick a machine from the list to see its status, logs, metrics and actions.</p>
      </div>

      <div class="detail-main" id="detailMain" hidden>
        <div class="detail-head">
          <button class="btn btn-ghost btn-sm back-btn" id="backBtn">
            <svg class="icon"><use href="#i-back" /></svg><span>Machines</span>
          </button>
          <div class="detail-id">
            <h1 class="detail-name" id="detailName">—</h1>
            <div class="detail-sub">
              <span class="status-pill" id="detailStatus" data-state="unknown"><span class="dot"></span><span class="label">Unknown</span></span>
              <span class="mono detail-mid" id="detailId"></span>
            </div>
          </div>
          <div class="detail-actions" id="detailActions"></div>
        </div>

        <div class="tabs" id="detailTabs" role="tablist">
          <button class="tab" role="tab" data-tab="overview" aria-label="Overview"><svg class="icon"><use href="#i-overview" /></svg><span class="tab-label">Overview</span></button>
          <button class="tab" role="tab" data-tab="logs" aria-label="Logs"><svg class="icon"><use href="#i-terminal" /></svg><span class="tab-label">Logs</span></button>
          <button class="tab" role="tab" data-tab="commands" aria-label="Commands"><svg class="icon"><use href="#i-terminal" /></svg><span class="tab-label">Commands</span></button>
          <button class="tab" role="tab" data-tab="metrics" aria-label="Metrics"><svg class="icon"><use href="#i-chart" /></svg><span class="tab-label">Metrics</span></button>
          <button class="tab" role="tab" data-tab="terminal" aria-label="Terminal"><svg class="icon"><use href="#i-terminal" /></svg><span class="tab-label">Terminal</span></button>
          <button class="tab" role="tab" data-tab="snapshots" aria-label="Snapshots"><svg class="icon"><use href="#i-snapshot" /></svg><span class="tab-label">Snapshots</span></button>
        </div>

        <div class="detail-body" id="detailBody" role="tabpanel"></div>
      </div>
    </main>
  </div>

  <dialog class="dialog" id="keyDialog" aria-labelledby="keyDialogTitle">
    <form method="dialog" class="dialog-form" id="keyForm">
      <div class="dialog-head">
        <div>
          <h2 class="dialog-title" id="keyDialogTitle">API keys</h2>
          <p class="dialog-sub">Keys stay in this browser's local storage. They are sent only to Instabox.</p>
        </div>
        <button type="button" class="btn btn-ghost btn-sm btn-icon" id="keyDialogClose" aria-label="Close">
          <svg class="icon"><use href="#i-close" /></svg>
        </button>
      </div>

      <div class="key-list" id="keyList"></div>

      <div class="field">
        <label class="field-label" for="keyName">Name</label>
        <input class="input" id="keyName" type="text" placeholder="e.g. Work" autocomplete="off" required />
      </div>
      <div class="field">
        <label class="field-label" for="keyValue">Key</label>
        <input class="input" id="keyValue" type="password" placeholder="ibk_…" autocomplete="off" spellcheck="false" required />
        <p class="field-hint">Starts with <code>ibk_</code>. Create one at <a href="https://dashboard.instabox.sh/dashboard/api-keys" target="_blank" rel="noopener">dashboard.instabox.sh → API keys</a>.</p>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="exportKeysBtn">
          <svg class="icon"><use href="#i-download" /></svg><span>Export</span>
        </button>
        <button type="button" class="btn btn-ghost btn-sm" id="importKeysBtn">
          <svg class="icon"><use href="#i-upload" /></svg><span>Import</span>
        </button>
        <input type="file" id="importKeyInput" accept="application/json,.json" hidden />
        <button type="submit" class="btn btn-primary btn-sm" id="saveKeyBtn">Add key</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
